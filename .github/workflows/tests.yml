name: Backend tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    # Keep the OS stable when GitHub moves ubuntu-latest to a new release.
    runs-on: ubuntu-24.04
    steps:
      # These action versions use Node.js 24 natively.
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python -m compileall -q main.py geography.py asia_analysis.py system_prompt.py llm_providers.py pdf_parser.py
